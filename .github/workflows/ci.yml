name: OpsMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U opsmind" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Lint
        run: |
          cd backend
          ruff check .
      - name: Test
        run: |
          cd backend
          pytest -x -v --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+psycopg://opsmind:opsmind@localhost:5432/opsmind
          JWT_SECRET: ci-test-secret
          ADMIN_PASSWORD: test
          DEBUG: "false"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build